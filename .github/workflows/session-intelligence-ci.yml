name: Session Intelligence Safety Checks

on:
  pull_request:
    paths:
      - "ES_ORB_Indicator_v1_2_SESSION_BRIDGE.pine"
      - "cloudflare/signal-bridge-worker/src/session_events.js"
      - "cloudflare/signal-bridge-worker/src/discord_intelligence.js"
      - "cloudflare/signal-bridge-worker/src/discord_intelligence_interactions.js"
      - "cloudflare/signal-bridge-worker/src/bot_scheduler.js"
      - "cloudflare/signal-bridge-worker/src/entry.js"
      - "cloudflare/signal-bridge-worker/register_discord_commands.mjs"
      - "cloudflare/signal-bridge-worker/migrations/0004_session_events.sql"
      - "cloudflare/signal-bridge-worker/PINE_SESSION_BRIDGE_V1.md"
      - ".github/workflows/session-intelligence-ci.yml"

permissions:
  contents: read

jobs:
  validate-session-intelligence:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check Worker module syntax
        run: |
          node --check cloudflare/signal-bridge-worker/src/session_events.js
          node --check cloudflare/signal-bridge-worker/src/discord_intelligence.js
          node --check cloudflare/signal-bridge-worker/src/discord_intelligence_interactions.js
          node --check cloudflare/signal-bridge-worker/src/bot_scheduler.js
          node --check cloudflare/signal-bridge-worker/src/entry.js
          node --check cloudflare/signal-bridge-worker/register_discord_commands.mjs

      - name: Validate session-event migration
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path

          db = sqlite3.connect(":memory:")
          for migration in sorted(Path("cloudflare/signal-bridge-worker/migrations").glob("*.sql")):
              db.executescript(migration.read_text())

          columns = {row[1] for row in db.execute("PRAGMA table_info(session_events)")}
          required = {
              "id", "received_at", "event_time", "session_date", "symbol", "stage",
              "side", "price", "strategy", "note", "orb_high", "orb_low", "orb_mid",
              "range_points", "bias", "setup", "target", "outcome", "payload_json", "source"
          }
          missing = sorted(required - columns)
          if missing:
              raise SystemExit(f"session_events migration missing columns: {missing}")
          print("session_events migration OK")
          PY

      - name: Verify hosted routes and Discord commands
        run: |
          grep -q 'url.pathname === "/tv-session"' cloudflare/signal-bridge-worker/src/entry.js
          grep -q 'url.pathname === "/session-events"' cloudflare/signal-bridge-worker/src/entry.js
          grep -q 'url.pathname === "/session-summary"' cloudflare/signal-bridge-worker/src/entry.js
          grep -q 'INTELLIGENCE_COMMANDS.has(command)' cloudflare/signal-bridge-worker/src/entry.js
          grep -q 'new Set(\["status", "orb", "brief", "news"\])' cloudflare/signal-bridge-worker/src/discord_intelligence_interactions.js
          grep -q 'name: "status"' cloudflare/signal-bridge-worker/register_discord_commands.mjs
          grep -q 'name: "orb"' cloudflare/signal-bridge-worker/register_discord_commands.mjs
          grep -q 'name: "brief"' cloudflare/signal-bridge-worker/register_discord_commands.mjs
          grep -q 'normalizeEventTime' cloudflare/signal-bridge-worker/src/session_events.js
          grep -q 'numeric > 10_000_000_000' cloudflare/signal-bridge-worker/src/session_events.js
          grep -q 'SESSION_CLOSE' cloudflare/signal-bridge-worker/src/session_events.js

      - name: Verify Pine Session Bridge contract
        run: |
          test -s ES_ORB_Indicator_v1_2_SESSION_BRIDGE.pine
          grep -q '^//@version=6' ES_ORB_Indicator_v1_2_SESSION_BRIDGE.pine
          grep -q 'Indicator v1.2 SESSION BRIDGE' ES_ORB_Indicator_v1_2_SESSION_BRIDGE.pine
          grep -q 'Enable Session Lifecycle alert() calls' ES_ORB_Indicator_v1_2_SESSION_BRIDGE.pine
          grep -q 'f_emit("PREMARKET"' ES_ORB_Indicator_v1_2_SESSION_BRIDGE.pine
          grep -q 'f_emit("ORB_FORMED"' ES_ORB_Indicator_v1_2_SESSION_BRIDGE.pine
          grep -q 'f_emit("PREOPEN"' ES_ORB_Indicator_v1_2_SESSION_BRIDGE.pine
          grep -q 'f_emit("OPEN_SNAPSHOT"' ES_ORB_Indicator_v1_2_SESSION_BRIDGE.pine
          grep -q 'f_emit("SETUP"' ES_ORB_Indicator_v1_2_SESSION_BRIDGE.pine
          grep -q 'f_emit("WAIT"' ES_ORB_Indicator_v1_2_SESSION_BRIDGE.pine
          grep -q 'f_emit("SESSION_CLOSE"' ES_ORB_Indicator_v1_2_SESSION_BRIDGE.pine
          grep -q 'alertcondition(longSig, title="Long Setup Ready"' ES_ORB_Indicator_v1_2_SESSION_BRIDGE.pine
          grep -q 'alertcondition(shortSig, title="Short Setup Ready"' ES_ORB_Indicator_v1_2_SESSION_BRIDGE.pine
          grep -q 'i_orbStart   = input.string("0800"' ES_ORB_Indicator_v1_2_SESSION_BRIDGE.pine
          grep -q 'i_orbEnd     = input.string("0815"' ES_ORB_Indicator_v1_2_SESSION_BRIDGE.pine
          grep -q 'i_tradeStart = input.string("0930"' ES_ORB_Indicator_v1_2_SESSION_BRIDGE.pine
          grep -q 'i_tradeEnd   = input.string("1100"' ES_ORB_Indicator_v1_2_SESSION_BRIDGE.pine
