name: Session Intelligence Safety Checks

on:
  pull_request:
    paths:
      - "cloudflare/signal-bridge-worker/src/session_events.js"
      - "cloudflare/signal-bridge-worker/src/discord_intelligence.js"
      - "cloudflare/signal-bridge-worker/src/discord_intelligence_interactions.js"
      - "cloudflare/signal-bridge-worker/src/entry.js"
      - "cloudflare/signal-bridge-worker/register_discord_commands.mjs"
      - "cloudflare/signal-bridge-worker/migrations/0004_session_events.sql"
      - ".github/workflows/session-intelligence-ci.yml"

permissions:
  contents: read

jobs:
  validate-session-intelligence:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check Worker module syntax
        run: |
          node --check cloudflare/signal-bridge-worker/src/session_events.js
          node --check cloudflare/signal-bridge-worker/src/discord_intelligence.js
          node --check cloudflare/signal-bridge-worker/src/discord_intelligence_interactions.js
          node --check cloudflare/signal-bridge-worker/src/entry.js
          node --check cloudflare/signal-bridge-worker/register_discord_commands.mjs

      - name: Validate session-event migration
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path

          db = sqlite3.connect(":memory:")
          for migration in sorted(Path("cloudflare/signal-bridge-worker/migrations").glob("*.sql")):
              db.executescript(migration.read_text())

          columns = {row[1] for row in db.execute("PRAGMA table_info(session_events)")}
          required = {
              "id", "received_at", "event_time", "session_date", "symbol", "stage",
              "side", "price", "strategy", "note", "orb_high", "orb_low", "orb_mid",
              "range_points", "bias", "setup", "target", "outcome", "payload_json", "source"
          }
          missing = sorted(required - columns)
          if missing:
              raise SystemExit(f"session_events migration missing columns: {missing}")
          print("session_events migration OK")
          PY

      - name: Verify hosted routes and Discord commands
        run: |
          grep -q 'url.pathname === "/tv-session"' cloudflare/signal-bridge-worker/src/entry.js
          grep -q 'url.pathname === "/session-events"' cloudflare/signal-bridge-worker/src/entry.js
          grep -q 'url.pathname === "/session-summary"' cloudflare/signal-bridge-worker/src/entry.js
          grep -q 'const INTELLIGENCE_COMMANDS = new Set(\["status", "orb", "brief"\])' cloudflare/signal-bridge-worker/src/entry.js
          grep -q 'name: "status"' cloudflare/signal-bridge-worker/register_discord_commands.mjs
          grep -q 'name: "orb"' cloudflare/signal-bridge-worker/register_discord_commands.mjs
          grep -q 'name: "brief"' cloudflare/signal-bridge-worker/register_discord_commands.mjs
          grep -q 'ORB_FORMED' cloudflare/signal-bridge-worker/src/session_events.js
          grep -q 'SESSION_CLOSE' cloudflare/signal-bridge-worker/src/session_events.js
