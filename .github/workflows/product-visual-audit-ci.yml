name: Product Visual Audit Checks

on:
  pull_request:
    paths:
      - "site/product-visuals-v2.css"
      - "site/product-visuals-v2.js"
      - "site/assets/product/**"
      - "scripts/build_pages_site.py"
      - "PRODUCT_AUDIT_2026-08-08.md"
      - ".github/workflows/product-visual-audit-ci.yml"

permissions:
  contents: read

jobs:
  validate-product-visuals:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Syntax checks
        run: |
          node --check site/product-visuals-v2.js
          python -m py_compile scripts/build_pages_site.py

      - name: Build website artifact
        run: python scripts/build_pages_site.py

      - name: Verify clean product visual layer
        run: |
          test -s _site/product-visuals-v2.css
          test -s _site/product-visuals-v2.js
          test -s _site/assets/product/hero-trade-win.svg
          test -s _site/assets/product/journal-trade-detail.svg
          test -s _site/assets/product/session-desk.svg
          test -s _site/assets/product/strategy-dna.svg
          grep -q 'product-visuals-v2.css' _site/index.html
          grep -q 'product-visuals-v2.js' _site/index.html
          grep -q 'assets/product/hero-trade-win.svg' site/product-visuals-v2.js
          grep -q 'assets/product/journal-trade-detail.svg' site/product-visuals-v2.js
          grep -q 'assets/product/session-desk.svg' site/product-visuals-v2.js
          grep -q 'assets/product/strategy-dna.svg' site/product-visuals-v2.js
          grep -q 'removeHomeDuplicateShowcase' site/product-visuals-v2.js
          grep -q 'removeHomeHistoricalPerformance' site/product-visuals-v2.js
          ! grep -q 'Historical numbers, kept separate from the product demo.' site/product-visuals-v2.js
          grep -q 'Visual standard' PRODUCT_AUDIT_2026-08-08.md

      - name: Guard product-facing demo labels
        run: |
          grep -q 'illustrative' site/assets/product/hero-trade-win.svg
          grep -q 'illustrative' site/assets/product/journal-trade-detail.svg
          grep -q 'illustrative' site/assets/product/session-desk.svg
