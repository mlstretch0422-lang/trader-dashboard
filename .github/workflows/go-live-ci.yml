name: Go-Live Safety Checks

on:
  pull_request:
  push:
    branches: ["fix/go-live-discord"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install focused test dependencies
        run: python -m pip install --disable-pip-version-check pandas pytest

      - name: Scan for committed Discord webhook credentials
        run: python scripts/check_public_secrets.py

      - name: Compile integration modules
        run: |
          python -m py_compile \
            trading_os/src/integrations/alert_bridge.py \
            trading_os/src/integrations/run_signal_bridge.py \
            trading_os/src/integrations/serve_signal_bridge.py \
            trading_os/src/integrations/live_market_brief.py \
            trading_os/src/integrations/daily_brief.py \
            trading_os/src/integrations/news_calendar_brief.py \
            trading_os/src/integrations/cron_runner.py

      - name: Check hosted Worker syntax
        run: |
          node --check cloudflare/signal-bridge-worker/src/index.js
          node --check cloudflare/signal-bridge-worker/src/discord_interactions.js
          node --check cloudflare/signal-bridge-worker/src/entry.js
          node --check cloudflare/signal-bridge-worker/register_discord_commands.mjs

      - name: Validate D1 migration SQL
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path

          db = sqlite3.connect(":memory:")
          for migration in sorted(Path("cloudflare/signal-bridge-worker/migrations").glob("*.sql")):
              db.executescript(migration.read_text())

          signal_columns = [row[1] for row in db.execute("PRAGMA table_info(signal_events)")]
          signal_required = {"id", "received_at", "symbol", "side", "event", "strategy", "note", "source"}
          signal_missing = sorted(signal_required - set(signal_columns))
          if signal_missing:
              raise SystemExit(f"signal_events migration missing columns: {signal_missing}")

          journal_columns = [row[1] for row in db.execute("PRAGMA table_info(journal_entries)")]
          journal_required = {
              "id", "created_at", "raw_text", "result", "source",
              "visibility", "review_status", "signal_event_id",
              "discord_guild_id", "discord_channel_id", "discord_message_id",
              "discord_author_id", "discord_interaction_id"
          }
          journal_missing = sorted(journal_required - set(journal_columns))
          if journal_missing:
              raise SystemExit(f"journal_entries migration missing columns: {journal_missing}")

          print("D1 migration schemas OK")
          PY

      - name: Test Discord bridge
        env:
          PYTHONPATH: trading_os
        run: pytest -q trading_os/tests/test_alert_bridge.py

      - name: Build website artifact
        run: python scripts/build_pages_site.py

      - name: Verify website output
        run: |
          test -s _site/index.html
          test -s _site/signals.html
          test -s _site/signals.css
          test -s _site/strategies.html
          test -s _site/mason-orb.html
          test -s _site/strategy.css
          test -s _site/journal.html
          test -s _site/journal.css
          test -s _site/indicators.html
          test -s _site/reports.html
          test -s _site/dashboard.html
          test -s _site/research-dashboard.html
          test -s _site/polish.css
          test -s _site/assets/research/SPX500_2026-07-08_10-23-12.png
          test -s _site/assets/research/Tradezella-Summary-June-26-2026.png
          test -s _site/report.json
          grep -q "Research it. Trade it. Record it. Improve it." _site/index.html
          grep -q "Built around Mason" _site/index.html
          grep -q "Indicator Library" _site/indicators.html
          grep -q "Validated live edge" _site/indicators.html
          grep -q "Reports & Research" _site/reports.html
          grep -q "research-dashboard.html" _site/dashboard.html
          grep -q "OS Home" _site/dashboard.html
          grep -q "polish.css" _site/trade-bible.html
          grep -q "Live Signal History" _site/signals.html
          grep -q "/events" _site/signals.html
          grep -q "href=\"journal.html\"" _site/signals.html
          grep -q "href=\"strategies.html\"" _site/trade-bible.html
          grep -q "href=\"journal.html\"" _site/evidence.html
          grep -q "Strategy Library" _site/strategies.html
          grep -q "Opening-range variants" _site/strategies.html
          grep -q "The ORB clock is not settled" _site/mason-orb.html
          grep -q "PF 1.431" _site/mason-orb.html
          grep -q "Journal Intelligence" _site/journal.html
          grep -q "/journal" _site/journal.html
          grep -q "Private-first by design" _site/journal.html
          grep -q "Discord Capture" _site/journal.html
          grep -q "discord_capture_configured" _site/journal.html
          grep -q "Capture to Journal" _site/journal.html
