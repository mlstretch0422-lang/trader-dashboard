name: Go-Live Safety Checks

on:
  pull_request:
  push:
    branches: ["fix/go-live-discord"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install focused test dependencies
        run: python -m pip install --disable-pip-version-check pandas pytest

      - name: Scan for committed Discord webhook credentials
        run: python scripts/check_public_secrets.py

      - name: Compile integration modules
        run: |
          python -m py_compile \
            trading_os/src/integrations/alert_bridge.py \
            trading_os/src/integrations/run_signal_bridge.py \
            trading_os/src/integrations/serve_signal_bridge.py \
            trading_os/src/integrations/live_market_brief.py \
            trading_os/src/integrations/daily_brief.py \
            trading_os/src/integrations/news_calendar_brief.py \
            trading_os/src/integrations/cron_runner.py

      - name: Check hosted Worker syntax
        run: |
          node --check cloudflare/signal-bridge-worker/src/index.js
          node --check cloudflare/signal-bridge-worker/src/discord_interactions.js
          node --check cloudflare/signal-bridge-worker/src/entry.js
          node --check cloudflare/signal-bridge-worker/register_discord_commands.mjs

      - name: Validate D1 migration SQL
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path

          db = sqlite3.connect(":memory:")
          for migration in sorted(Path("cloudflare/signal-bridge-worker/migrations").glob("*.sql")):
              db.executescript(migration.read_text())

          signal_columns = [row[1] for row in db.execute("PRAGMA table_info(signal_events)")]
          signal_required = {"id", "received_at", "symbol", "side", "event", "strategy", "note", "source"}
          signal_missing = sorted(signal_required - set(signal_columns))
          if signal_missing:
              raise SystemExit(f"signal_events migration missing columns: {signal_missing}")

          journal_columns = [row[1] for row in db.execute("PRAGMA table_info(journal_entries)")]
          journal_required = {
              "id", "created_at", "raw_text", "result", "source",
              "visibility", "review_status", "signal_event_id",
              "discord_guild_id", "discord_channel_id", "discord_message_id",
              "discord_author_id", "discord_interaction_id"
          }
          journal_missing = sorted(journal_required - set(journal_columns))
          if journal_missing:
              raise SystemExit(f"journal_entries migration missing columns: {journal_missing}")

          print("D1 migration schemas OK")
          PY

      - name: Test Discord bridge
        env:
          PYTHONPATH: trading_os
        run: pytest -q trading_os/tests/test_alert_bridge.py

      - name: Build website artifact
        run: python scripts/build_pages_site.py

      - name: Verify website output
        run: |
          test -s _site/index.html
          test -s _site/signals.html
          test -s _site/signals.css
          test -s _site/strategies.html
          test -s _site/indicators.html
          test -s _site/journal.html
          test -s _site/journal.css
          test -s _site/mason.html
          test -s _site/mason-orb.html
          test -s _site/trade-bible.html
          test -s _site/evidence.html
          test -s _site/strategy.css
          test -s _site/research.css
          test -s _site/polish.css
          test -s _site/reports.html
          test -s _site/dashboard.html
          test -s _site/report.json

          grep -q "Research it. Trade it. Record it. Improve it." _site/index.html
          grep -q "Signal Bridge Premium" _site/index.html
          grep -q "Bring your own trading into the system" _site/index.html
          grep -q "Public playbook, flagship desk, and community" _site/index.html
          grep -q "Mason · Strategy &amp; Research" _site/index.html
          grep -q "Trade, review, and build with Signal Bridge connected" _site/index.html
          ! grep -q "The beta already has a live home" _site/index.html
          test "$(grep -o '<h3>Strategy Lab</h3>' _site/index.html | wc -l | tr -d ' ')" = "1"
          test "$(grep -o '<h3>Indicator Workspace</h3>' _site/index.html | wc -l | tr -d ' ')" = "1"
          grep -q "interactive-surface" _site/index.html
          grep -q "legal-disclaimer" _site/index.html

          grep -q "Strategy Playbook" _site/strategies.html
          grep -q "Setup Library" _site/strategies.html
          grep -q "Sweep + Reclaim" _site/strategies.html
          grep -q "Confluence Dictionary" _site/strategies.html
          grep -q "Strategy Lab" _site/strategies.html
          ! grep -q "Historical Strategy Lineage" _site/strategies.html
          ! grep -q "Current Flagship" _site/strategies.html

          grep -q "Indicator Workspace" _site/indicators.html
          grep -q "Module Library" _site/indicators.html
          grep -q "Premium Workspace" _site/indicators.html
          grep -q "Decision Panel" _site/indicators.html
          ! grep -q "Current Code Lineage" _site/indicators.html
          ! grep -q "External Design Research" _site/indicators.html

          grep -q "Mason · Strategy &amp; Research" _site/mason.html
          grep -q "Mason ORB" _site/mason.html
          grep -q "Mason Trade Bible" _site/mason.html
          grep -q "Research &amp; Evidence" _site/mason.html
          grep -q "Strategy Lineage" _site/mason.html
          grep -q "PF 1.78" _site/mason.html
          grep -q "V6" _site/mason.html

          grep -q "Research &amp; Evidence" _site/evidence.html
          grep -q "External Research Stack" _site/evidence.html
          grep -q "Intraday liquidity dynamics" _site/evidence.html
          grep -q "Research Stages" _site/evidence.html
          grep -q "PF 1.78" _site/evidence.html
          grep -q "V6 ORB Midpoint Continuation" _site/evidence.html

          grep -q "Current Strategy Framework" _site/mason-orb.html
          grep -q "Setup Anatomy" _site/mason-orb.html
          grep -q "Break → retest → reclaim" _site/mason-orb.html
          grep -q "Mason’s actual decision process" _site/trade-bible.html

          grep -q "url=evidence.html" _site/reports.html
          grep -q "url=evidence.html" _site/dashboard.html
          grep -q "polish.css" _site/trade-bible.html
          grep -q "Live Signal History" _site/signals.html
          grep -q "Premium Signal Layer" _site/signals.html
          grep -q "/events" _site/signals.html
          grep -q "href=\"journal.html\"" _site/signals.html
          grep -q "Journal Intelligence" _site/journal.html
          grep -q "/journal" _site/journal.html
          grep -q "Private-first by design" _site/journal.html
          grep -q "Private member workspace" _site/journal.html
          grep -q "discord_capture_configured" _site/journal.html
          grep -q "Capture to Journal" _site/journal.html
          grep -q "Publish to Journal" _site/journal.html
          grep -q "journal-entry-media" _site/journal.html
          grep -q "journal-entry-media" _site/journal.css
          grep -q "legal-disclaimer" _site/signals.html
          grep -q "legal-disclaimer" _site/journal.html

          grep -q 'href="mason.html">Mason</a>' _site/index.html
          grep -q 'class="active" href="mason.html">Mason</a>' _site/mason.html
          grep -q 'class="active" href="mason.html">Mason</a>' _site/evidence.html
          grep -q 'class="active" href="mason.html">Mason</a>' _site/trade-bible.html
          grep -q 'class="active" href="mason.html">Mason</a>' _site/mason-orb.html

          grep -q 'name: "Publish to Journal"' cloudflare/signal-bridge-worker/register_discord_commands.mjs
          grep -q 'name: "publish"' cloudflare/signal-bridge-worker/register_discord_commands.mjs
          grep -q 'commandName === "publish to journal"' cloudflare/signal-bridge-worker/src/discord_interactions.js
          grep -q 'visibility: publishRequested ? "PUBLISHED" : "PRIVATE"' cloudflare/signal-bridge-worker/src/discord_interactions.js
