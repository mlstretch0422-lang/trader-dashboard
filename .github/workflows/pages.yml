name: Signal Bridge Website

on:
  pull_request:
    paths:
      - "site/**"
      - "index.html"
      - "assets/**"
      - "manifest.json"
      - "metadata.json"
      - "trading_os/src/integrations/report.json"
      - "trading_os/src/integrations/export_shareable_dashboard.py"
      - "scripts/build_pages_site.py"
      - ".github/workflows/pages.yml"
  push:
    branches: ["main"]
    paths:
      - "site/**"
      - "index.html"
      - "assets/**"
      - "manifest.json"
      - "metadata.json"
      - "trading_os/src/integrations/report.json"
      - "trading_os/src/integrations/export_shareable_dashboard.py"
      - "scripts/build_pages_site.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "signal-bridge-pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build public site artifact
        run: python scripts/build_pages_site.py

      - name: Upload pull-request build artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: signal-bridge-site-preview
          path: _site

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
