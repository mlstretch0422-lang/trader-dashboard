name = "signal-bridge-webhook"
main = "src/entry.js"
compatibility_date = "2026-08-07"
workers_dev = true

# Keep market/news context warm without relying on the local Mac.
# The calendar provider fails closed when TRADING_ECONOMICS_API_KEY is absent.
[triggers]
crons = ["*/15 * * * *"]

# Wrangler 4.45+ can provision this D1 resource on deploy when the account does
# not already have the binding. The generated resource ID stays account-side and
# must never be treated as a trading credential.
[[d1_databases]]
binding = "DB"
migrations_dir = "migrations"

[secrets]
required = [
  "DISCORD_WEBHOOK_URL",
  "SIGNAL_BRIDGE_TEST_TOKEN",
  "JOURNAL_INGEST_TOKEN",
  "DISCORD_PUBLIC_KEY",
  "DISCORD_APPLICATION_ID",
  "DISCORD_GUILD_ID",
  "DISCORD_JOURNAL_CHANNEL_ID",
]

# Optional future production provider secret:
# TRADING_ECONOMICS_API_KEY
