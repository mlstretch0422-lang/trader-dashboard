name = "signal-bridge-webhook"
main = "src/entry.js"
compatibility_date = "2026-08-07"
workers_dev = true

# Keep market/news context warm without relying on the local Mac.
# The second trigger runs every five minutes across the U.S. morning in UTC;
# bot_scheduler.js converts scheduledTime to America/New_York and only posts
# at the exact desk windows, so DST is handled in code rather than hard-coded UTC.
[triggers]
crons = ["*/15 * * * *", "*/5 12-17 * * 1-5"]

[[d1_databases]]
binding = "DB"
migrations_dir = "migrations"

[secrets]
required = [
  "DISCORD_WEBHOOK_URL",
  "SIGNAL_BRIDGE_TEST_TOKEN",
  "JOURNAL_INGEST_TOKEN",
  "DISCORD_PUBLIC_KEY",
  "DISCORD_APPLICATION_ID",
  "DISCORD_GUILD_ID",
  "DISCORD_JOURNAL_CHANNEL_ID",
]

# Optional production secrets:
# TRADING_ECONOMICS_API_KEY
# DISCORD_INTELLIGENCE_WEBHOOK_URL (falls back to DISCORD_WEBHOOK_URL)
