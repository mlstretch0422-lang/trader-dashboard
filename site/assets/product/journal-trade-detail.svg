dity.</text><text x="24" y="343" fill="#b7c9d8" font-size="11">Bear continuation failed.</text><text x="24" y="364" fill="#b7c9d8" font-size="11">Reclaim held above OR midpoint.</text><text x="24" y="385" fill="#b7c9d8" font-size="11">Target: prior session high.</text><rect x="24" y="420" width="334" height="72" rx="13" fill="#0a1c2b" stroke="#21445f"/><text x="40" y="445" fill="#65cfff" font-size="10" font-weight="900">SCREENSHOT ATTACHED</text><text x="40" y="468" fill="#7692a8" font-size="10">Chart + execution preserved with this record</text></g><rect x="58" y="690" width="1314" height="122" rx="18" fill="#07131f" stroke="#17344c"/><text x="82" y="720" fill="#7da5c0" font-size="10" font-weight="900">POST-TRADE REVIEW</text><text x="82" y="751" fill="#e7f3fd" font-size="15" font-weight="800">What worked: waited for the reclaim and entered after the level held.</text><text x="82" y="778" fill="#7f98ac" font-size="11">Strategy DNA links this trade to the exact setup rules and indicator configuration active when it happened.</text><text x="60" y="850" fill="#4e697d" font-size="10">Signal Bridge product mockup · illustrative member trade · not a historical performance record</text></g></svg>