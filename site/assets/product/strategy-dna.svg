<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="t d"><title id="t">Signal Bridge Strategy DNA illustrative product visual</title><desc id="d">A version-aware strategy history linking rules, indicator configurations and evidence samples.</desc><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#08131f"/><stop offset="1" stop-color="#03070c"/></linearGradient></defs><rect width="1200" height="760" rx="30" fill="url(#bg)"/><rect x="28" y="28" width="1144" height="704" rx="23" fill="none" stroke="#17344e"/><g font-family="Inter,Arial,sans-serif"><text x="58" y="76" fill="#eef7ff" font-size="22" font-weight="900">STRATEGY DNA</text><text x="58" y="104" fill="#6b879e" font-size="12">VERSION → INDICATOR → EVIDENCE → DECISION</text><g transform="translate(58 144)"><rect width="1084" height="126" rx="18" fill="#0a1825" stroke="#19405d"/><circle cx="50" cy="48" r="22" fill="#172b3c" stroke="#4faeff"/><text x="50" y="53" fill="#83d0ff" font-size="12" font-weight="900" text-anchor="middle">V1</text><text x="90" y="39" fill="#e8f4ff" font-size="16" font-weight="900">ORB Midpoint Reclaim</text><text x="90" y="64" fill="#7f99ad" font-size="11">Location → reclaim → continuation · 08:00–08:15 ORB</text><text x="90" y="93" fill="#63dba8" font-size="10" font-weight="900">BACKTESTED / RECONSTRUCTED SAMPLE</text><g transform="translate(680 24)" font-size="10"><text x="0" y="0" fill="#657f95">TRADES</text><text x="0" y="29" fill="#eef7ff" font-size="18" font-weight="900">38</text><text x="120" y="0" fill="#657f95">NET</text><text x="120" y="29" fill="#71e3ab" font-size="18" font-weight="900">+$2,381</text><text x="260" y="0" fill="#657f95">PF</text><text x="260" y="29" fill="#b7a9ff" font-size="18" font-weight="900">1.78</text></g></g><line x1="112" y1="270" x2="112" y2="330" stroke="#2c628c" stroke-width="2"/><circle cx="112" cy="300" r="6" fill="#5dc9ff"/><g transform="translate(58 330)"><rect width="1084" height="126"